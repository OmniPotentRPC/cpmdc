# Configuration for `pixi run -e docs lychee`.
# Options: https://lychee.cli.rs/guides/config/
no_progress = true
max_retries = 3
retry_wait_time = 2
timeout = 20

# GitHub answers bursts of requests with 429 Too Many Requests.
# doi.org citation links are excluded below so lychee does not follow
# them to publisher sites.
accept = ["200..=299", "429"]
user_agent = "Mozilla/5.0 (compatible; lychee; +https://github.com/lycheeverse/lychee)"

# Check the anchors of links such as README.md#citation.
include_fragments = "anchor-only"

exclude = [
  "^https://doi\\.org/",
]
