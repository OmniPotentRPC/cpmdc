name: ci

on:
  push:
    branches:
      - main
      - 'ci/**'
      - feat/readcon-0.17
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Version copies match version.txt
        run: python3 scripts/release_assert.py

  stub-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CPU flags
        run: |
          grep -m1 flags /proc/cpuinfo || true
          lscpu || true
          echo "cpmdc SIMD paths: minimage avx, avx2 and avx512 kernels, picked at run time"
          echo "scalar: exercised by the test suite"
          echo "avx2: not exercised"
          echo "avx512: not exercised"
          echo "neon: not exercised"
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: latest
          cache: true
      - name: ASE and i-PI for the calculator and socket tests
        run: pixi run python -m pip install 'ase>=3.23' 'pytest>=7' 'ipi>=3.3'
      - name: Full meson suite (stub + embed E2E)
        run: pixi run test-stub
      - name: C ABI inventory matches libcpmdc and the headers
        run: python3 scripts/abi_inventory.py --check build/libcpmdc.so
      - name: Default restart build does not link readcon
        run: |
          if nm -A build/cpmdc-restart build/test_cpmd_restart | grep -E 'rkr_|readcon_core'; then
            echo "default restart build references readcon"
            exit 1
          fi
      - name: E2E suite only
        run: pixi run test-e2e
      - name: Cmocka suite
        run: pixi run test-cmocka
      - name: Keep unstripped libraries for the ISA audit
        run: tools/collect_isa_audit_libs.sh build isa-audit-libs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unstripped-libs-x86_64
          path: isa-audit-libs/

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CPU flags
        run: |
          grep -m1 flags /proc/cpuinfo || true
          lscpu || true
          echo "cpmdc SIMD paths: minimage avx, avx2 and avx512 kernels, picked at run time"
          echo "scalar: exercised by the test suite"
          echo "avx2: not exercised"
          echo "avx512: not exercised"
          echo "neon: not exercised"
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: latest
          cache: true
      # The SIGILL is an illegal far jump, bytes ff e9, at __interceptor_trampoline_mprotect+4.
      # That address is the last byte of ASan's 5-byte jmp rel32, resumed as a new opcode.
      # libfabric ofi_write_patch calls mprotect from opal_common_ofi_fi_domain during MPI_Init.
      # Open MPI's memory patcher is already off, and this hook belongs to libfabric.
      # FI_MR_CACHE_MONITOR=disabled leaves the monitor null, so ofi_memhooks_start never patches mprotect.
      # The variable is set only on this job. The MPI launcher is unchanged.
      - name: Stub suite under ASan/UBSan
        env:
          FI_MR_CACHE_MONITOR: disabled
        run: pixi run test-stub-sanitize
      - name: Sanitize restart build does not link readcon
        run: |
          if nm -A build-sanitize/cpmdc-restart build-sanitize/test_cpmd_restart | grep -E 'rkr_|readcon_core'; then
            echo "sanitize restart build references readcon"
            exit 1
          fi

  stub-and-e2e-arm64:
    name: stub-and-e2e (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: CPU flags
        run: |
          grep -m1 flags /proc/cpuinfo || true
          lscpu || true
          echo "cpmdc SIMD paths: none on aarch64; minimage dispatches on x86_64 only"
          echo "scalar: exercised by the test suite"
          echo "avx2: not exercised"
          echo "avx512: not exercised"
          echo "neon: not exercised"
      # pixi.toml platforms are linux-64, osx-64, and osx-arm64.
      # This job uses the distro toolchain instead of that lock.
      - name: Apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran pkg-config python3 python3-venv \
            capnproto libcapnp-dev libcmocka-dev libopenmpi-dev cmake \
            ninja-build file
      - name: Meson
        run: |
          python3 -m venv "${RUNNER_TEMP}/meson-venv"
          "${RUNNER_TEMP}/meson-venv/bin/pip" install 'meson>=1.5.2,<2'
          echo "${RUNNER_TEMP}/meson-venv/bin" >> "${GITHUB_PATH}"
      - name: ASE and i-PI for the calculator and socket tests
        run: python3 -m pip install --user 'ase>=3.23' 'pytest>=7' 'ipi>=3.3'
      - name: Full meson suite
        run: |
          . scripts/with_baseline_flags.sh
          # Ubuntu 24.04 cmocka.h uses jmp_buf and va_list and does not include their headers.
          # The prefix defines _GNU_SOURCE before those headers so memfd flags stay visible.
          export CFLAGS="${CFLAGS:+$CFLAGS }-include ${GITHUB_WORKSPACE}/tests/distro_cmocka_prefix.h"
          meson setup build -Dwith_tests=true
          meson compile -C build
          meson test -C build --print-errorlogs
          if nm -A build/cpmdc-restart build/test_cpmd_restart | grep -E 'rkr_|readcon_core'; then
            echo "arm64 restart build references readcon"
            exit 1
          fi
      - name: Keep unstripped libraries for the ISA audit
        run: tools/collect_isa_audit_libs.sh build isa-audit-libs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unstripped-libs-arm64
          path: isa-audit-libs/

  gromacs-qmmm:
    name: gromacs-qmmm (${{ matrix.route }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # build: GROMACS against BUILD/tools/gromacs, thread-MPI.
        # installed: meson install into build/prefix, GROMACS against the
        #   installed libcp2k.pc found through PKG_CONFIG_PATH, thread-MPI.
        # mpi: GROMACS with the Open MPI of the pixi environment, mdrun on 1,
        #   2 and 4 ranks with domain decomposition.
        route: [build, installed, mpi]
    env:
      # Four ranks on a runner that may count fewer cores.
      CPMDC_MPIEXEC: mpiexec --oversubscribe
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: latest
          cache: true
      - name: ASE for the reference calculator
        run: pixi run python -m pip install 'ase>=3.23' 'pytest>=7'
      - name: cpmdc and libcpmdc_gromacs
        run: |
          pixi run bash -c '. scripts/with_baseline_flags.sh && meson setup build -Dwith_tests=true --prefix="$PWD/build/prefix" && meson compile -C build && ninja -C build water_blyp_params.bin water_blyp_periodic_params.bin'
          test -f build/tools/gromacs/pkgconfig/libcp2k.pc
      - name: meson install
        if: matrix.route == 'installed'
        run: |
          pixi run meson install -C build
          pc=$(find build/prefix -path '*/cpmdc/gromacs/pkgconfig/libcp2k.pc')
          test -n "$pc"
          cp2k_dir=$(dirname "$(dirname "$pc")")
          libdir=$(PKG_CONFIG_PATH="$cp2k_dir/pkgconfig" pixi run pkg-config --variable=libdir libcp2k)
          echo "CP2K_DIR=$cp2k_dir" >> "$GITHUB_ENV"
          echo "CPMDC_LIBRARY=$libdir/libcpmdc.so" >> "$GITHUB_ENV"
          echo "CPMDC_GROMACS_LIB=$libdir/libcpmdc_gromacs.so" >> "$GITHUB_ENV"
      - name: Build-tree libraries
        if: matrix.route != 'installed'
        run: |
          echo "CP2K_DIR=$PWD/build/tools/gromacs" >> "$GITHUB_ENV"
          echo "CPMDC_LIBRARY=$PWD/build/libcpmdc.so" >> "$GITHUB_ENV"
          echo "CPMDC_GROMACS_LIB=$PWD/build/libcpmdc_gromacs.so" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gromacs-2025.5-${{ matrix.route }}
          key: gromacs-2025.5-cpmdc-${{ matrix.route }}-${{ hashFiles('scripts/ci/build_gromacs_cpmdc.sh', 'tools/gromacs/libcp2k.h', 'tools/gromacs/pkgconfig/*', 'pixi.lock') }}
      - name: GROMACS 2025.5, double, GMX_CP2K=ON against libcpmdc_gromacs
        run: |
          prefix="${RUNNER_TEMP}/gromacs-2025.5-${{ matrix.route }}"
          if [ "${{ matrix.route }}" = mpi ]; then
            mode=mpi gmx="$prefix/bin/gmx_mpi_d" var=CPMDC_GMX_MPI
          else
            mode=thread-mpi gmx="$prefix/bin/gmx_d" var=CPMDC_GMX
          fi
          if [ ! -x "$gmx" ]; then
            pixi run scripts/ci/build_gromacs_cpmdc.sh 2025.5 "$prefix" "$CP2K_DIR" "$mode"
          fi
          echo "$var=$gmx" >> "$GITHUB_ENV"
      - name: GROMACS route tests, none skipped
        run: |
          set -o pipefail
          export CPMDC_TEST_PARAMS="$PWD/build/water_blyp_params.bin"
          export CPMDC_TEST_PERIODIC_PARAMS="$PWD/build/water_blyp_periodic_params.bin"
          if [ "${{ matrix.route }}" = mpi ]; then select=(-k test_mpi); else select=(-k 'not test_mpi'); fi
          pixi run python -m pytest -q -rs tests/python/test_gromacs.py "${select[@]}" | tee gromacs-pytest.log
          if grep -E '^SKIPPED' gromacs-pytest.log; then
            echo "GROMACS route tests skipped"
            exit 1
          fi
      - name: Full meson suite with GROMACS on PATH
        if: matrix.route != 'mpi'
        run: pixi run meson test -C build --print-errorlogs

  readcon-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: latest
          cache: true
      - name: Rust 1.99
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.0 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Byte-exact CON restart
        run: |
          . "$HOME/.cargo/env"
          rustc --version
          pixi run test-readcon

  isa-audit-x86_64:
    name: isa audit (x86_64)
    needs: stub-and-e2e
    permissions:
      contents: read
    uses: OmniPotentRPC/rgpot/.github/workflows/isa-audit.yml@06638f2ece83b12731b387ba819b67dc2151556b
    with:
      artifact-name: unstripped-libs-x86_64
      allow-file: isa-allow.toml
      baseline: x86-64

  isa-audit-arm64:
    name: isa audit (arm64)
    needs: stub-and-e2e-arm64
    permissions:
      contents: read
    uses: OmniPotentRPC/rgpot/.github/workflows/isa-audit.yml@06638f2ece83b12731b387ba819b67dc2151556b
    with:
      artifact-name: unstripped-libs-arm64
      allow-file: isa-allow.toml
      baseline: armv8-a
