# ci.yml ignores docs and Markdown paths, so the prose gate lives here and
# runs on every change, docs-only ones included.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref !=
    'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}
jobs:
  snapper:
    name: Snapper prose wrapping
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name ==
            'main' }}
          environments: prose
          pixi-version: v0.70.2
      - name: Snapper prose wrapping check
        run: pixi run -e prose snapper-check
name: Prose
on:
  pull_request: {}
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
permissions:
  contents: read
