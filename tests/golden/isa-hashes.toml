# cpmdc has no hot numeric kernel and no second SIMD path.
# The digest is SHA-256 of the empty f64 buffer (zero bytes).
# Thread count does not change that buffer.
# avx2, avx512, and neon are not exercised: this repository does not ship them.

[[case]]
name = "no-numeric-kernel"
recipe = "cpmdc ships no hot numeric kernel. Hash the empty f64 buffer. The only path is the compiler default."
sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
threads = [1, 2, 3, 8]
paths = ["scalar"]
not_exercised = ["avx2", "avx512", "neon"]
